<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Legal Text Color-Coder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Legal Text Color-Coder</h1>
    <div class="container">
        <textarea id="inputText" placeholder="Paste your legal text here..."></textarea>
        <br>
        <input type="file" id="fileInput" accept=".txt">
        <br>
        <button id="processButton">Process Text</button>
    </div>
    
    <!-- Loading Indicator -->
    <div id="loading" class="loading" style="display: none;">
        <p>Processing your text, please wait...</p>
        <div class="spinner"></div>
    </div>
    
    <div id="outputContainer"></div>

    <!-- Include DOMPurify from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.4.0/purify.min.js" integrity="sha512-fy5o6DAmEM6sZpEEUbG3z3MgG3D+6o2+RlIEX0Ytl8Ry2uVvc8PpGxhePnhgt39uNrgIimBLdKxTRN2IDJxUgQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="script.js"></script>
</body>
</html>
